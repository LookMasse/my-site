<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live US Stock Movers – Top 15 Gainers &amp; Losers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 20px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      padding-bottom: 14px;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 8px #10b981;
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: #131722;
      border: 1px solid #2a2e39;
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 18px;
      border-bottom: 1px solid #2a2e39;
      font-weight: 600;
      font-size: 1.05rem;
    }
    iframe {
      width: 100%;
      height: 680px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="dot"></span> Live US Stock Market Movers</h1>
    <span style="color:#94a3b8;font-size:0.85rem;">NYSE / NASDAQ Real-Time Stream</span>
  </header>

  <main class="grid">
    <section class="panel">
      <div class="panel-header" style="color:#10b981;">Top 15 US Gainers (Select "Percent Gainers" tab)</div>
      <iframe
        src="https://tradingview-widget.com"
        scrolling="no">
      </iframe>
    </section>

    <section class="panel">
      <div class="panel-header" style="color:#ef4444;">Top 15 US Losers (Select "Percent Losers" tab)</div>
      <iframe
        src="https://tradingview-widget.com"
        scrolling="no">
      </iframe>
    </section>
  </main>

</body>
</html>
