  <script>
    const REFRESH_MS = 60000;
    const sourceSelect = document.getElementById("sourceSelect");
    const fmpKeyInput = document.getElementById("fmpKeyInput");
    const refreshBtn = document.getElementById("refreshBtn");
    const gainersBody = document.getElementById("gainersBody");
    const losersBody = document.getElementById("losersBody");
    const statusText = document.getElementById("statusText");
    const lastUpdated = document.getElementById("lastUpdated");

    const savedFmpKey = localStorage.getItem("fmp_api_key");
    if (savedFmpKey) fmpKeyInput.value = savedFmpKey;

    sourceSelect.addEventListener("change", () => {
      fmpKeyInput.style.display = sourceSelect.value === "fmp" ? "inline-block" : "none";
      fetchLiveMovers();
    });

    function parseNum(val) {
      if (typeof val === "number") return val;
      if (!val) return 0;
      return Number(String(val).replace(/[$,%+()]/g, "").replace(/,/g, "")) || 0;
    }

    function formatVol(volStr) {
      if (!volStr) return "--";
      const s = String(volStr).trim();
      if (/[BMK]$/i.test(s)) return s;
      const n = parseNum(s);
      if (!n) return "--";
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return n.toLocaleString("en-US");
    }

    function renderRows(tbody, list, isGainer) {
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="color: var(--muted);">No live quotes returned.</td></tr>';
        return;
      }

      tbody.innerHTML = list.slice(0, 15).map((item, i) => {
        const price = parseNum(item.price).toFixed(2);
        const chg = parseNum(item.change);
        const pct = parseNum(item.percentChange);
        const chgStr = (chg >= 0 ? "+" : "") + chg.toFixed(2);
        const pctStr = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
        const pillClass = isGainer ? "pill-gain" : "pill-loss";

        return `
          <tr>
            <td class="rank">${i + 1}</td>
            <td class="ticker">${item.symbol}</td>
            <td class="company" title="${item.name || ""}">${item.name || "-"}</td>
            <td class="num">$${price}</td>
            <td class="num">${chgStr}</td>
            <td class="num"><span class="pill ${pillClass}">${pctStr}</span></td>
            <td class="num">${formatVol(item.volume)}</td>
          </tr>
        `;
      }).join("");
    }

    async function fetchTextViaProxies(targetUrl) {
      const u1 = new URL("https://allorigins.win");
      u1.searchParams.set("url", targetUrl);

      const u2 = new URL("https://codetabs.com");
      u2.searchParams.set("quest", targetUrl);

      const proxyUrls = Array.of(u1.toString(), u2.toString());
      let lastErr;

      for (const proxyUrl of proxyUrls) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          const res = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          if (text.trim().startsWith("{")) {
            try {
              const parsed = JSON.parse(text);
              if (parsed && typeof parsed.contents === "string" && parsed.contents.length > 50) {
                return parsed.contents;
              }
            } catch (e) {}
          }
          if (text.length > 50) return text;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("Proxy connection failed");
    }
    function parseYahooHtml(htmlString) {
      const doc = new DOMParser().parseFromString(htmlString, "text/html");
      const rows = Array.from(doc.querySelectorAll("table tr"));
      const items = Array.of();

      for (const tr of rows) {
        const cells = Array.from(tr.querySelectorAll("td"));
        if (cells.length < 5) continue;

        const rawSym = (cells.at(0).textContent || "").trim().split(/\s+/).at(0);
        if (!rawSym || !/^[A-Z]{1,5}(\.[A-Z])?$/.test(rawSym)) continue;

        const nameText = (cells.at(1).textContent || "").trim();
        let priceVal = 0;
        let chgVal = 0;
        let pctVal = 0;
        let volText = "--";

        for (let idx = 2; idx < cells.length; idx++) {
          const txt = (cells.at(idx).textContent || "").trim();
          if (!priceVal && /^\$?\d[\d,]*\.\d+$/.test(txt.split(/\s+/).at(0))) {
            priceVal = parseNum(txt.split(/\s+/).at(0));
          } else if (txt.includes("%")) {
            pctVal = parseNum(txt);
          } else if (/^[+-]\d[\d,]*\.\d+$/.test(txt)) {
            chgVal = parseNum(txt);
          } else if (/^\d[\d.,]*[BMK]$/i.test(txt) || /^\d{1,3}(,\d{3})+$/.test(txt)) {
            volText = txt;
          }
        }

        if (priceVal > 0 && pctVal !== 0) {
          if (!chgVal) chgVal = priceVal - (priceVal / (1 + pctVal / 100));
          items.push({
            symbol: rawSym,
            name: nameText || rawSym,
            price: priceVal,
            change: chgVal,
            percentChange: pctVal,
            volume: volText
          });
        }
        if (items.length >= 15) break;
      }
      return items;
    }

    function parseFinvizHtml(htmlString) {
      const doc = new DOMParser().parseFromString(htmlString, "text/html");
      const rows = Array.from(doc.querySelectorAll("tr"));
      const items = Array.of();

      for (const tr of rows) {
        const cells = Array.from(tr.querySelectorAll("td"));
        if (cells.length < 10) continue;
        const rankTxt = (cells.at(0).textContent || "").trim();
        const symTxt = (cells.at(1).textContent || "").trim();
        if (!/^\d+$/.test(rankTxt) || !/^[A-Z]{1,5}$/.test(symTxt)) continue;

        const nameTxt = (cells.at(2).textContent || "").trim();
        const priceTxt = (cells.at(8).textContent || "").trim();
        const pctTxt = (cells.at(9).textContent || "").trim();
        const volTxt = (cells.at(10) ? cells.at(10).textContent : "--").trim();

        const priceVal = parseNum(priceTxt);
        const pctVal = parseNum(pctTxt);
        const chgVal = priceVal ? priceVal - (priceVal / (1 + pctVal / 100)) : 0;

        if (priceVal > 0) {
          items.push({
            symbol: symTxt,
            name: nameTxt || symTxt,
            price: priceVal,
            change: chgVal,
            percentChange: pctVal,
            volume: volTxt
          });
        }
        if (items.length >= 15) break;
      }
      return items;
    }

    async function fetchFromYahoo() {
      const pair = await Promise.all(Array.of(
        fetchTextViaProxies("https://yahoo.com"),
        fetchTextViaProxies("https://yahoo.com")
      ));
      const gainers = parseYahooHtml(pair.at(0));
      const losers = parseYahooHtml(pair.at(1));
      if (!gainers.length && !losers.length) throw new Error("Yahoo layout blocked");
      return { gainers: gainers, losers: losers, label: "Live feed: Yahoo Finance US Markets" };
    }

    async function fetchFromFinviz() {
      const gUrl = "https://finviz.com";
      const lUrl = "https://finviz.com";
      const pair = await Promise.all(Array.of(fetchTextViaProxies(gUrl), fetchTextViaProxies(lUrl)));
      const gainers = parseFinvizHtml(pair.at(0));
      const losers = parseFinvizHtml(pair.at(1));
      if (!gainers.length && !losers.length) throw new Error("Finviz screener unavailable");
      return { gainers: gainers, losers: losers, label: "Live feed: US Intraday Screener (NYSE / NASDAQ)" };
    }

    async function fetchFromFMP() {
      const key = fmpKeyInput.value.trim();
      if (!key) throw new Error("Enter your free Financial Modeling Prep API key");
      localStorage.setItem("fmp_api_key", key);
      const gUrl = new URL("https://financialmodelingprep.com");
      gUrl.searchParams.set("apikey", key);
      const lUrl = new URL("https://financialmodelingprep.com");
      lUrl.searchParams.set("apikey", key);
      const pair = await Promise.all(Array.of(fetch(gUrl.toString()), fetch(lUrl.toString())));
      const gJson = await pair.at(0).json();
      const lJson = await pair.at(1).json();
      if (gJson["Error Message"] || lJson["Error Message"]) {
        throw new Error(gJson["Error Message"] || lJson["Error Message"]);
      }
      const mapFmp = arr => (Array.isArray(arr) ? arr : Array.of()).map(item => ({
        symbol: item.symbol, name: item.name, price: item.price,
        change: item.change, percentChange: item.changesPercentage, volume: item.volume || 0
      }));
      return { gainers: mapFmp(gJson), losers: mapFmp(lJson), label: "Live feed: Financial Modeling Prep (FMP)" };
    }

    async function fetchLiveMovers() {
      const now = new Date();
      statusText.textContent = "Fetching live US market quotes...";
      try {
        let result;
        if (sourceSelect.value === "fmp") {
          result = await fetchFromFMP();
        } else {
          try {
            result = await fetchFromYahoo();
          } catch (yahooErr) {
            result = await fetchFromFinviz();
          }
        }
        renderRows(gainersBody, result.gainers, true);
        renderRows(losersBody, result.losers, false);
        statusText.textContent = result.label;
      } catch (err) {
        statusText.textContent = "Feed error: " + err.message;
        gainersBody.innerHTML = '<tr><td colspan="7" style="color: var(--red);">Unable to load: ' + err.message + '</td></tr>';
        losersBody.innerHTML = '<tr><td colspan="7" style="color: var(--red);">Unable to load: ' + err.message + '</td></tr>';
      }
      lastUpdated.textContent = "Last updated: " + now.toLocaleTimeString();
    }

    refreshBtn.addEventListener("click", fetchLiveMovers);
    fetchLiveMovers();
    setInterval(fetchLiveMovers, REFRESH_MS);
  </script>
</body>
</html>
