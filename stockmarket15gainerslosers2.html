  <script>
    function formatVol(n) {
      if (!n) return "--";
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return n.toLocaleString("en-US");
    }

    function render(tbody, rows, isGain) {
      tbody.innerHTML = rows.map((r, i) => `
        <tr>
          <td style="color:var(--muted)">${i + 1}</td>
          <td class="ticker">${r.symbol}</td>
          <td class="company" title="${r.name}">${r.name}</td>
          <td class="num">$${r.price.toFixed(2)}</td>
          <td class="num">${r.change >= 0 ? "+" : ""}${r.change.toFixed(2)}</td>
          <td class="num"><span class="pill ${isGain ? "pill-gain" : "pill-loss"}">${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(2)}%</span></td>
          <td class="num">${formatVol(r.volume)}</td>
        </tr>
      `).join("");
    }

    async function queryScanner(sortOrder) {
      const payload = {
        filter: [
          { left: "exchange", operation: "in_range", right: ["NYSE", "NASDAQ"] },
          { left: "close", operation: "greater", right: 1 },
          { left: "volume", operation: "greater", right: 100000 }
        ],
        options: { lang: "en" },
        symbols: { query: { types: ["stock"] }, tickers: [] },
        columns: ["name", "description", "close", "change_abs", "change", "volume"],
        sort: { sortBy: "change", sortOrder: sortOrder },
        range: [0, 15]
      };

      const res = await fetch("https://tradingview.com", {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error("Scanner HTTP " + res.status);
      const raw = await res.json();

      return (raw.data || []).map(item => {
        const d = item.d || [];
        return {
          symbol: d[0],
          name: d[1] || d[0],
          price: Number(d[2] || 0),
          change: Number(d[3] || 0),
          pct: Number(d[4] || 0),
          volume: Number(d[5] || 0)
        };
      });
    }

    async function loadMovers() {
      const status = document.getElementById("statusText");
      try {
        const [gainers, losers] = await Promise.all([
          queryScanner("desc"),
          queryScanner("asc")
        ]);
        render(document.getElementById("gainersBody"), gainers, true);
        render(document.getElementById("losersBody"), losers, false);
        status.textContent = "Live feed: NYSE & NASDAQ Intraday Scanner";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
      document.getElementById("lastUpdated").textContent = "Last updated: " + new Date().toLocaleTimeString();
    }

    loadMovers();
    setInterval(loadMovers, 30000);
  </script>
</body>
</html>
